name: Release main tip

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version from the VERSION file (without v)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release target
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(cat VERSION)" = "$VERSION"
          test "$(git branch --show-current)" = main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "v$VERSION already exists" >&2
            exit 1
          fi

      - name: Validate source
        run: |
          set -euo pipefail
          test -f Main.qml
          test -x bin/subspace-communicator
          test -x install.sh
          bash -n bin/subspace-communicator
          bash -n install.sh
          python3 -m py_compile bridge/subspace.py

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          target="$(git rev-parse HEAD)"
          notes=()
          if test -f "releases/$VERSION.md"; then
            notes=(--notes-file "releases/$VERSION.md")
          fi
          gh release create "v$VERSION" \
            --target "$target" \
            --title "Subspace Communicator $VERSION" \
            "${notes[@]}" \
            --generate-notes
